[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-genesis"
version = "5.0.0"
description = "From one idea to a blind-judged manuscript. A runner that drives your own model providers; no API keys stored in the repo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
book-genesis = "runner.cli:main"

[tool.setuptools]
packages = ["runner"]

[tool.setuptools.package-data]
runner = ["config/*.yaml"]
