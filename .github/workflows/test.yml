name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build tools
        run: python -m pip install pytest rich wheel setuptools
      - name: Run test suite
        run: python -m pytest tests -q
      - name: Build offline wheel
        run: python -m pip wheel --no-deps --no-build-isolation --no-cache-dir --wheel-dir dist .
