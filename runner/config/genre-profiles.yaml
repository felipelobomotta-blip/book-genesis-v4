# Single source of truth for genre constants. Prompts reference these values;
# they never restate them. Ranges come from knowledge/bestseller-dna.md
# (chapter length by genre, dialogue share by genre) and from the revision
# policy in docs/adr/0001-runner-orquestra-juiz-cego.md.

default:
  words_per_chapter_min: 2000
  words_per_chapter_max: 4500
  dialogue_min_pct: 20
  dialogue_max_pct: 40
  max_revision_cycles: 3
  disruptor_default: true
  ai_pattern_budget_per_1k: 2.0

literary:
  words_per_chapter_min: 2500
  words_per_chapter_max: 5000
  dialogue_min_pct: 15
  dialogue_max_pct: 35
  max_revision_cycles: 3
  disruptor_default: true
  ai_pattern_budget_per_1k: 1.5

